apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: airbyte-secret-store
spec:
  provider: 
    aws:
      service: SecretsManager
      region: eu-central-1 
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-airbyte-credentials
            key: access_key
          secretAccessKeySecretRef: 
            name: aws-airbyte-credentials
            key: secret_access_key